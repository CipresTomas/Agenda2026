<form #registerForm="ngForm" (ngSubmit)="registrarse(registerForm)">
  <h1>Registrarse</h1>
  <label for="name">Nombre y apellido:</label>
  <input type="text" name="name" id="name" placeholder="Tu nombre" title="Nombre" ngModel required />
  <label for="email">Correo electrónico:</label>
  <input type="email" name="email" id="email" placeholder="tu@email.com" title="Correo electrónico" ngModel required />
  <label for="password">Contraseña:</label>
  <input type="password" name="password" id="password" placeholder="Mínimo 4 caracteres" title="Contraseña" ngModel minlength="4" required />
  <label for="password2">Repetí la contraseña:</label>
  <input type="password" name="password2" id="password2" placeholder="Repetí tu contraseña" title="Repetir contraseña" ngModel required />
  @if (errorRegister) {
    <p>Completá los datos y verificá que las contraseñas coincidan.</p>
  }
  <button type="submit">Registrarse</button>

  <p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
</form>
