<form novalidate (submit)="registrarse(); $event.preventDefault()">
  <h1>Registrarse</h1>
  <label for="name">Nombre y apellido:</label>
  <input type="text" id="name" placeholder="Tu nombre" title="Nombre" [formField]="registerForm.name" />
  <label for="email">Correo electrónico:</label>
  <input type="email" id="email" placeholder="tu@email.com" title="Correo electrónico" [formField]="registerForm.email" />
  <label for="password">Contraseña:</label>
  <input type="password" id="password" placeholder="Mínimo 4 caracteres" title="Contraseña" [formField]="registerForm.password" />
  <label for="password2">Repetí la contraseña:</label>
  <input type="password" id="password2" placeholder="Repetí tu contraseña" title="Repetir contraseña" [formField]="registerForm.password2" />
  @if (errorRegister()) {
    <p>Completá los datos y verificá que las contraseñas coincidan.</p>
  }
  <button type="submit">Registrarse</button>

  <p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
</form>
