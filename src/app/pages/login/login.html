<form #loginForm="ngForm" (ngSubmit)="iniciarSesion(loginForm)">
  <h1>Iniciar sesión</h1>
  <label for="email">Correo electrónico:</label>
  <input type="email" name="email" id="email" placeholder="tu@email.com" title="Correo electrónico" ngModel required />
  <label for="password">Contraseña:</label>
  <input type="password" name="password" id="password" placeholder="Tu contraseña" title="Contraseña" ngModel minlength="4" required />
  @if (errorLogin) {
    <p>Datos incorrectos. Revisá tu correo y contraseña.</p>
  }
  <button type="submit">Iniciar sesión</button>

  <p>¿No tenés una cuenta? <a routerLink="/register">Registrate acá</a></p>
  </form>
