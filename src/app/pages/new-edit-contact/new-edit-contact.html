<main class="contact-page">
  <section class="contact-panel">
    <header class="contact-header">
      <div>
        @if (contacto) {
          <h1>Editar contacto</h1>
        } @else {
          <h1>Nuevo contacto</h1>
        }
        <p class="subtitle">Completá los datos de tu contacto</p>
      </div>
      <a routerLink="/contact-list">Volver</a>
    </header>

    <form class="contact-form" #contactForm="ngForm" (ngSubmit)="guardar(contactForm)">
      <div class="field-group">
        <label for="name">Nombre*</label>
        <input id="name" name="name" type="text" [(ngModel)]="name" minlength="2" required />
      </div>
      <div class="field-group">
        <label for="phone">Telefono*</label>
        <input id="phone" name="phone" type="tel" [(ngModel)]="phone" required />
      </div>
      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" />
      </div>
      <div class="field-group">
        <label for="address">Direccion</label>
        <input id="address" name="address" type="text" [(ngModel)]="address" />
      </div>
      <div class="field-group">
        <label for="company">Empresa</label>
        <input id="company" name="company" type="text" [(ngModel)]="company" />
      </div>
      <div class="field-group">
        <label for="imgurl">URL de imagen</label>
        <input id="imgurl" name="imgurl" type="url" [(ngModel)]="imgurl" />
      </div>
      <label>
        <input name="isFavorite" type="checkbox" [(ngModel)]="isFavorite" /> Favorito
      </label>
      @if (error) {
        <p class="empty-state">Completá el nombre y el teléfono.</p>
      }
      <button type="submit">{{ contacto ? 'Editar' : 'Agregar' }}</button>
    </form>
  </section>
</main>
