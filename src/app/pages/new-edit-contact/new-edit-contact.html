<main class="contact-page">
  <section class="contact-panel">
    <header class="contact-header">
      <div>
        @if (contacto) {
          <h1>Editar contacto</h1>
        } @else {
          <h1>Nuevo contacto</h1>
        }
        <p class="subtitle">Completá los datos de tu contacto</p>
      </div>
      <a routerLink="/contacts">Volver</a>
      <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    </header>

    <form class="contact-form" (submit)="guardar($event)">
      <div class="field-group">
        <label for="firstName">Nombre*</label>
        <input id="firstName" type="text" [formField]="contactForm.firstName" />
      </div>
      <div class="field-group">
        <label for="lastName">Apellido</label>
        <input id="lastName" type="text" [formField]="contactForm.lastName" />
      </div>
      <div class="field-group">
        <label for="number">Telefono</label>
        <input id="number" type="tel" [formField]="contactForm.number" />
      </div>
      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" type="email" [formField]="contactForm.email" />
      </div>
      <div class="field-group">
        <label for="address">Direccion</label>
        <input id="address" type="text" [formField]="contactForm.address" />
      </div>
      <div class="field-group">
        <label for="company">Empresa</label>
        <input id="company" type="text" [formField]="contactForm.company" />
      </div>
      <div class="field-group">
        <label for="image">URL de imagen</label>
        <input id="image" type="url" [formField]="contactForm.image" />
      </div>
      <div class="field-group">
        <label for="description">Descripción</label>
        <input id="description" type="text" [formField]="contactForm.description" />
      </div>
      <div class="field-group">
        <label for="image-file">O seleccioná una imagen</label>
        <input id="image-file" type="file" accept="image/*" (change)="seleccionarImagen($event)" />
      </div>
      @if (imagenPreview()) {
        <img class="image-preview" width="96" height="96" [src]="imagenPreview()" alt="Vista previa de la imagen" />
      }
      <label>

      </label>
      @if (error()) {
        <p class="empty-state">Completá el nombre.</p>
      }
      @if (apiError()) {
        <p class="empty-state">No se pudo guardar el contacto. Revisá la conexión e intentá nuevamente.</p>
      }
      <button type="submit">{{ contacto ? 'Editar' : 'Agregar' }}</button>
    </form>
  </section>
</main>
